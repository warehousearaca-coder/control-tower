<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Tower — Operações Logísticas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── RESET & BASE ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue:    #1A56DB;
  --blue-lt: #EFF6FF;
  --green:   #16a34a;
  --green-lt:#dcfce7;
  --amber:   #d97706;
  --amber-lt:#fef3c7;
  --red:     #dc2626;
  --red-lt:  #fee2e2;
  --gray:    #6b7280;
  --bg:      #f8f9fb;
  --surface: #ffffff;
  --border:  rgba(0,0,0,.08);
  --text:    #111827;
  --muted:   #6b7280;
  --font:    'DM Sans', sans-serif;
  --mono:    'DM Mono', monospace;
  --radius:  12px;
  --radius-sm: 8px;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.5;
}

/* ── CONFIG BANNER ────────────────────────────────────────── */
#config-banner {
  background: #fff8e1;
  border-bottom: 1px solid #f59e0b44;
  padding: 10px 24px;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: #92400e;
}
#config-banner a { color: var(--blue); text-decoration: underline; cursor: pointer; }
#config-banner button {
  margin-left: auto;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 5px 14px;
  font-size: 12px;
  font-family: var(--font);
  cursor: pointer;
}
#config-form {
  background: #fff;
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: none;
  gap: 12px;
  flex-wrap: wrap;
  align-items: flex-end;
}
#config-form.open { display: flex; }
#config-form label { font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
#config-form input {
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 13px;
  font-family: var(--mono);
  width: 320px;
  color: var(--text);
}
#config-form button {
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 7px 18px;
  font-family: var(--font);
  font-size: 13px;
  cursor: pointer;
}

/* ── LAYOUT ───────────────────────────────────────────────── */
.app { max-width: 1280px; margin: 0 auto; padding: 24px 24px 40px; }

/* ── HEADER ───────────────────────────────────────────────── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 24px;
  flex-wrap: wrap;
  gap: 12px;
}
.header-left { display: flex; align-items: center; gap: 12px; }
.logo {
  width: 40px; height: 40px;
  background: var(--blue);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.logo svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.header-title { font-size: 18px; font-weight: 600; letter-spacing: -.3px; }
.header-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
.header-right { display: flex; align-items: center; gap: 10px; }
.live-badge {
  display: flex; align-items: center; gap: 6px;
  background: var(--green-lt);
  color: var(--green);
  font-size: 12px; font-weight: 500;
  padding: 5px 12px;
  border-radius: 20px;
}
.live-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.btn-refresh {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 6px 14px;
  font-family: var(--font);
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  transition: background .15s;
}
.btn-refresh:hover { background: #f3f4f6; }
.btn-refresh svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinning { animation: spin .7s linear infinite; }

/* ── TABS ─────────────────────────────────────────────────── */
.tabs {
  display: flex; gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 20px;
  overflow-x: auto;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  padding: 6px 16px;
  border-radius: 7px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  color: var(--muted);
  transition: all .15s;
  border: none; background: none; font-family: var(--font);
}
.tab:hover { color: var(--text); background: #f3f4f6; }
.tab.active { background: var(--blue); color: #fff; }

/* ── KPI STRIP ────────────────────────────────────────────── */
.kpi-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 10px;
  margin-bottom: 20px;
}
.kpi {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  animation: fadeUp .4s ease both;
}
@keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.kpi-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .05em;
  margin-bottom: 8px;
  display: flex; align-items: center; gap: 6px;
}
.kpi-label svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
.kpi-value { font-size: 26px; font-weight: 600; letter-spacing: -.5px; line-height: 1; }
.kpi-delta { font-size: 11px; margin-top: 5px; }
.up { color: var(--green); }
.dn { color: var(--red); }
.neutral { color: var(--muted); }

/* ── CARDS GRID ───────────────────────────────────────────── */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.unit-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  animation: fadeUp .4s ease both;
  transition: box-shadow .2s;
}
.unit-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.07); }
.unit-card.crit { border-left: 3px solid var(--red); }
.unit-card.warn { border-left: 3px solid var(--amber); }
.unit-card.ok   { border-left: 3px solid var(--green); }

.card-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--border);
}
.card-name {
  display: flex; align-items: center; gap: 8px;
  font-size: 14px; font-weight: 600;
}
.card-icon {
  width: 30px; height: 30px;
  border-radius: 7px;
  background: var(--blue-lt);
  display: flex; align-items: center; justify-content: center;
}
.card-icon svg { width: 15px; height: 15px; stroke: var(--blue); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.status-badge {
  font-size: 10px; font-weight: 600;
  padding: 3px 9px; border-radius: 20px;
  text-transform: uppercase; letter-spacing: .04em;
}
.badge-ok   { background: var(--green-lt); color: var(--green); }
.badge-warn { background: var(--amber-lt); color: var(--amber); }
.badge-crit { background: var(--red-lt);   color: var(--red); }

.card-body { padding: 14px 16px; }

.metrics-row {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; margin-bottom: 14px;
}
.metric {
  background: var(--bg);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
}
.metric-lbl { font-size: 10px; color: var(--muted); margin-bottom: 3px; font-weight: 500; }
.metric-val { font-size: 16px; font-weight: 600; letter-spacing: -.3px; }
.metric-sub { font-size: 10px; color: var(--muted); margin-top: 1px; }

/* ── PROGRESS BARS ────────────────────────────────────────── */
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: flex; flex-direction: column; gap: 3px; }
.bar-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
.bar-track {
  height: 5px; background: #f3f4f6;
  border-radius: 99px; overflow: hidden;
}
.bar-fill {
  height: 100%; border-radius: 99px;
  transition: width .6s ease;
}
.fill-green { background: var(--green); }
.fill-blue  { background: var(--blue); }
.fill-amber { background: var(--amber); }
.fill-red   { background: var(--red); }

/* ── ALERTS SECTION ───────────────────────────────────────── */
.alerts-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.alert-item {
  display: flex; align-items: flex-start; gap: 7px;
  font-size: 11px; color: var(--muted);
  margin-bottom: 4px;
}
.alert-dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }

/* ── OCORRÊNCIAS ──────────────────────────────────────────── */
.section-title {
  font-size: 11px; font-weight: 600; color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em;
  margin-bottom: 10px;
}
.ocorr-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; }
.ocorr-item {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  animation: fadeUp .4s ease both;
}
.ocorr-icon {
  width: 32px; height: 32px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.ocorr-icon svg { width: 16px; height: 16px; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.oi-crit { background: var(--red-lt); }
.oi-crit svg { stroke: var(--red); }
.oi-warn { background: var(--amber-lt); }
.oi-warn svg { stroke: var(--amber); }
.oi-info { background: var(--blue-lt); }
.oi-info svg { stroke: var(--blue); }
.ocorr-unit { font-size: 11px; font-weight: 600; color: var(--muted); }
.ocorr-msg { font-size: 13px; color: var(--text); margin-top: 1px; }
.ocorr-time { font-size: 11px; color: var(--muted); margin-left: auto; white-space: nowrap; }

/* ── FOOTER ───────────────────────────────────────────────── */
.footer {
  display: flex; justify-content: space-between; align-items: center;
  font-size: 11px; color: var(--muted);
  border-top: 1px solid var(--border);
  padding-top: 16px; margin-top: 8px;
}

/* ── LOADING / ERROR ──────────────────────────────────────── */
.loading-state, .error-state {
  text-align: center; padding: 60px 20px;
  color: var(--muted);
}
.loading-spinner {
  width: 32px; height: 32px;
  border: 3px solid #e5e7eb;
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 16px;
}
.error-state { color: var(--red); }
.update-time { font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<!-- CONFIG BANNER -->
<div id="config-banner">
  <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex-shrink:0"><circle cx="8" cy="8" r="7"/><line x1="8" y1="6" x2="8" y2="8"/><line x1="8" y1="11" x2="8.01" y2="11"/></svg>
  Configure sua URL e chave do Supabase para conectar dados reais.
  <a onclick="toggleConfig()">Configurar agora</a>
  <button onclick="toggleConfig()">Configurar</button>
</div>

<div id="config-form">
  <label>
    URL do projeto Supabase
    <input type="text" id="input-url" placeholder="https://xxxx.supabase.co" />
  </label>
  <label>
    Anon Key (chave pública)
    <input type="text" id="input-key" placeholder="eyJhbGciOiJIUzI1NiIs..." />
  </label>
  <button onclick="salvarConfig()">Salvar e conectar</button>
</div>

<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </div>
      <div>
        <div class="header-title">Control Tower</div>
        <div class="header-sub">Operações Logísticas · 5 unidades</div>
      </div>
    </div>
    <div class="header-right">
      <div class="live-badge">
        <div class="live-dot"></div>
        <span id="last-update-badge">Ao vivo</span>
      </div>
      <button class="btn-refresh" onclick="carregarDados(true)">
        <svg id="refresh-icon" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>
        Atualizar
      </button>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs" id="tabs-container">
    <button class="tab active" data-tab="all" onclick="setTab(this)">Todas as unidades</button>
  </div>

  <!-- KPI STRIP -->
  <div class="kpi-strip" id="kpi-strip">
    <div class="loading-state" style="grid-column:1/-1">
      <div class="loading-spinner"></div>
      <div>Carregando dados…</div>
    </div>
  </div>

  <!-- CARDS -->
  <div class="section-title" id="cards-title" style="display:none">Desempenho por unidade</div>
  <div class="cards-grid" id="cards-grid"></div>

  <!-- OCORRÊNCIAS -->
  <div class="section-title" id="ocorr-title" style="display:none">Ocorrências ativas</div>
  <div class="ocorr-list" id="ocorr-list"></div>

  <!-- FOOTER -->
  <div class="footer">
    <span class="update-time" id="footer-time">—</span>
    <span>Atualização automática a cada 30s</span>
  </div>

</div>

<script>
// ── CONFIGURAÇÃO ───────────────────────────────────────────
let SUPABASE_URL = localStorage.getItem('ct_url') || '';
let SUPABASE_KEY = localStorage.getItem('ct_key') || '';

function toggleConfig() {
  const f = document.getElementById('config-form');
  f.classList.toggle('open');
  if (f.classList.contains('open')) {
    document.getElementById('input-url').value = SUPABASE_URL;
    document.getElementById('input-key').value = SUPABASE_KEY;
  }
}

function salvarConfig() {
  SUPABASE_URL = document.getElementById('input-url').value.trim().replace(/\/$/, '');
  SUPABASE_KEY = document.getElementById('input-key').value.trim();
  localStorage.setItem('ct_url', SUPABASE_URL);
  localStorage.setItem('ct_key', SUPABASE_KEY);
  document.getElementById('config-form').classList.remove('open');
  document.getElementById('config-banner').style.display = 'none';
  carregarDados();
}

if (SUPABASE_URL && SUPABASE_KEY) {
  document.getElementById('config-banner').style.display = 'none';
}

// ── ESTADO ─────────────────────────────────────────────────
let todosOsDados = [];
let todasOcorrencias = [];
let tabAtiva = 'all';
let intervalo = null;

// ── API SUPABASE ────────────────────────────────────────────
async function fetchSupabase(path) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Accept': 'application/json',
    }
  });
  if (!res.ok) throw new Error(`Erro ${res.status}: ${await res.text()}`);
  return res.json();
}

// ── DADOS DEMO (quando Supabase não está configurado) ───────
function dadosDemo() {
  return [
    { id:'1', codigo:'CD_SP',  nome:'CD São Paulo',          tipo:'CD', cidade:'São Paulo',
      recebidos:1820, em_separacao:420, expedidos:1350, cancelados:12,
      sla_percentual:97.1, meta_percentual:95, pedidos_atrasados:40,
      estoque_nivel:88, ruptura_percentual:1.8, giro:4.2, skus_ativos:3420,
      pedidos_por_hora:312, operadores_ativos:28, turno:'tarde', ultima_atualizacao: new Date().toISOString() },
    { id:'2', codigo:'CD_RJ',  nome:'CD Rio de Janeiro',     tipo:'CD', cidade:'Rio de Janeiro',
      recebidos:1240, em_separacao:380, expedidos:980, cancelados:22,
      sla_percentual:91.3, meta_percentual:95, pedidos_atrasados:108,
      estoque_nivel:74, ruptura_percentual:4.1, giro:3.8, skus_ativos:2980,
      pedidos_por_hora:245, operadores_ativos:21, turno:'tarde', ultima_atualizacao: new Date().toISOString() },
    { id:'3', codigo:'CD_PE',  nome:'CD Pernambuco',         tipo:'CD', cidade:'Recife',
      recebidos:890, em_separacao:210, expedidos:720, cancelados:8,
      sla_percentual:95.8, meta_percentual:95, pedidos_atrasados:31,
      estoque_nivel:82, ruptura_percentual:2.3, giro:3.5, skus_ativos:2640,
      pedidos_por_hora:198, operadores_ativos:17, turno:'tarde', ultima_atualizacao: new Date().toISOString() },
    { id:'4', codigo:'DS_BSB', nome:'Dark Store Brasília',   tipo:'DS', cidade:'Brasília',
      recebidos:512, em_separacao:190, expedidos:380, cancelados:18,
      sla_percentual:83.4, meta_percentual:95, pedidos_atrasados:85,
      estoque_nivel:61, ruptura_percentual:7.8, giro:5.1, skus_ativos:1200,
      pedidos_por_hora:87, operadores_ativos:8, turno:'tarde', ultima_atualizacao: new Date().toISOString() },
    { id:'5', codigo:'DS_POA', nome:'Dark Store Porto Alegre',tipo:'DS', cidade:'Porto Alegre',
      recebidos:350, em_separacao:95, expedidos:310, cancelados:5,
      sla_percentual:96.2, meta_percentual:95, pedidos_atrasados:13,
      estoque_nivel:79, ruptura_percentual:1.9, giro:4.8, skus_ativos:1180,
      pedidos_por_hora:72, operadores_ativos:6, turno:'tarde', ultima_atualizacao: new Date().toISOString() },
  ];
}

function ocorrenciasDemo() {
  return [
    { nivel:'crit', unidade_codigo:'DS_BSB', unidade_nome:'Dark Store Brasília', tipo:'SLA_CRITICO', descricao:'SLA em 83.4% — abaixo da meta de 95%. Capacidade operacional comprometida.', criado_em: new Date(Date.now()-22*60000).toISOString() },
    { nivel:'crit', unidade_codigo:'DS_BSB', unidade_nome:'Dark Store Brasília', tipo:'RUPTURA_ESTOQUE', descricao:'Ruptura 7.8% em estoque. Reposição emergencial necessária.', criado_em: new Date(Date.now()-35*60000).toISOString() },
    { nivel:'warn', unidade_codigo:'CD_RJ',  unidade_nome:'CD Rio de Janeiro',   tipo:'SLA_ATENCAO', descricao:'SLA em 91.3% — risco de não atingir meta diária de 95%.', criado_em: new Date(Date.now()-70*60000).toISOString() },
    { nivel:'warn', unidade_codigo:'CD_RJ',  unidade_nome:'CD Rio de Janeiro',   tipo:'RUPTURA_ESTOQUE', descricao:'SKU Bebidas com estoque 38% abaixo do mínimo. Pedido em aberto.', criado_em: new Date(Date.now()-108*60000).toISOString() },
    { nivel:'info', unidade_codigo:'CD_PE',  unidade_nome:'CD Pernambuco',        tipo:'PRODUTIVIDADE', descricao:'Produtividade 5% abaixo da média histórica neste turno.', criado_em: new Date(Date.now()-135*60000).toISOString() },
  ];
}

// ── CARREGAMENTO ────────────────────────────────────────────
async function carregarDados(manual = false) {
  const icon = document.getElementById('refresh-icon');
  icon.classList.add('spinning');

  try {
    if (!SUPABASE_URL || !SUPABASE_KEY) {
      todosOsDados = dadosDemo();
      todasOcorrencias = ocorrenciasDemo();
    } else {
      const [dashboard, ocorr] = await Promise.all([
        fetchSupabase('vw_dashboard?select=*'),
        fetchSupabase('ocorrencias?select=*,unidades(codigo,nome)&status=eq.aberta&order=criado_em.desc&limit=20'),
      ]);
      todosOsDados = dashboard;
      todasOcorrencias = ocorr.map(o => ({
        ...o,
        unidade_codigo: o.unidades?.codigo,
        unidade_nome: o.unidades?.nome,
      }));
    }

    construirTabs();
    renderizar();
    const agora = new Date();
    document.getElementById('footer-time').textContent = `Última atualização: ${agora.toLocaleTimeString('pt-BR')}`;
    document.getElementById('last-update-badge').textContent = manual ? 'Atualizado' : 'Ao vivo';
    setTimeout(() => document.getElementById('last-update-badge').textContent = 'Ao vivo', 2000);

  } catch (e) {
    document.getElementById('kpi-strip').innerHTML = `<div class="error-state" style="grid-column:1/-1">Erro ao carregar dados: ${e.message}</div>`;
    console.error(e);
  } finally {
    icon.classList.remove('spinning');
  }
}

// ── TABS ────────────────────────────────────────────────────
function construirTabs() {
  const container = document.getElementById('tabs-container');
  container.innerHTML = '<button class="tab active" data-tab="all" onclick="setTab(this)">Todas as unidades</button>';
  todosOsDados.forEach(u => {
    const btn = document.createElement('button');
    btn.className = 'tab';
    btn.dataset.tab = u.id;
    btn.textContent = u.codigo.replace('_', ' ');
    btn.onclick = function() { setTab(this); };
    container.appendChild(btn);
  });
}

function setTab(el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  tabAtiva = el.dataset.tab;
  renderizar();
}

// ── HELPERS ─────────────────────────────────────────────────
function status(u) {
  if (u.sla_percentual < 88 || u.ruptura_percentual > 6) return 'crit';
  if (u.sla_percentual < 94 || u.ruptura_percentual > 3) return 'warn';
  return 'ok';
}
function badgeClass(s) { return `badge-${s}`; }
function badgeLabel(s) { return s === 'ok' ? 'Normal' : s === 'warn' ? 'Atenção' : 'Crítico'; }
function barColor(pct, invert = false) {
  const v = invert ? 100 - pct : pct;
  if (v >= 90) return 'fill-green';
  if (v >= 75) return 'fill-blue';
  if (v >= 60) return 'fill-amber';
  return 'fill-red';
}
function fmt(n) { return (n ?? 0).toLocaleString('pt-BR'); }
function fmtPct(n) { return `${(+(n ?? 0)).toFixed(1)}%`; }
function tempoRelativo(iso) {
  const diff = (Date.now() - new Date(iso)) / 60000;
  if (diff < 1) return 'agora';
  if (diff < 60) return `há ${Math.round(diff)} min`;
  return `há ${Math.round(diff/60)}h ${Math.round(diff%60)}min`;
}

// ── RENDERIZAÇÃO ────────────────────────────────────────────
function renderizar() {
  const lista = tabAtiva === 'all' ? todosOsDados : todosOsDados.filter(u => u.id === tabAtiva);
  renderKPIs(lista);
  renderCards(lista);
  renderOcorrencias();
  document.getElementById('cards-title').style.display = lista.length ? '' : 'none';
  document.getElementById('ocorr-title').style.display = todasOcorrencias.length ? '' : 'none';
}

function renderKPIs(lista) {
  if (!lista.length) { document.getElementById('kpi-strip').innerHTML = ''; return; }
  const totalRec  = lista.reduce((a,u) => a + (u.recebidos||0), 0);
  const totalExp  = lista.reduce((a,u) => a + (u.expedidos||0), 0);
  const slaMedia  = lista.reduce((a,u) => a + (u.sla_percentual||0), 0) / lista.length;
  const ocAberta  = todasOcorrencias.filter(o => tabAtiva === 'all' || lista.some(u => u.codigo === o.unidade_codigo)).length;
  const rupMedia  = lista.reduce((a,u) => a + (u.ruptura_percentual||0), 0) / lista.length;
  const slaOk = slaMedia >= 95;

  document.getElementById('kpi-strip').innerHTML = `
    <div class="kpi" style="animation-delay:.05s">
      <div class="kpi-label"><svg viewBox="0 0 24 24"><path d="M5 8h14M5 8a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v.5"/><path d="M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8"/></svg>Pedidos recebidos</div>
      <div class="kpi-value">${fmt(totalRec)}</div>
      <div class="kpi-delta neutral">hoje</div>
    </div>
    <div class="kpi" style="animation-delay:.1s">
      <div class="kpi-label"><svg viewBox="0 0 24 24"><path d="M9 17l-3-3 3-3M15 7l3 3-3 3"/><line x1="12" y1="4" x2="12" y2="20"/></svg>Expedidos</div>
      <div class="kpi-value">${fmt(totalExp)}</div>
      <div class="kpi-delta ${totalRec>0 ? 'up' : 'neutral'}">${totalRec > 0 ? Math.round(totalExp/totalRec*100) + '% do total' : '—'}</div>
    </div>
    <div class="kpi" style="animation-delay:.15s">
      <div class="kpi-label"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>SLA médio</div>
      <div class="kpi-value" style="color:${slaOk ? 'var(--green)' : 'var(--red)'}">${fmtPct(slaMedia)}</div>
      <div class="kpi-delta ${slaOk ? 'up' : 'dn'}">${slaOk ? '▲ acima da meta' : '▼ abaixo da meta'}</div>
    </div>
    <div class="kpi" style="animation-delay:.2s">
      <div class="kpi-label"><svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Ocorrências</div>
      <div class="kpi-value" style="color:${ocAberta > 0 ? 'var(--red)' : 'var(--green)'}">${ocAberta}</div>
      <div class="kpi-delta ${ocAberta > 0 ? 'dn' : 'up'}">${ocAberta > 0 ? 'abertas' : 'tudo normal'}</div>
    </div>
    <div class="kpi" style="animation-delay:.25s">
      <div class="kpi-label"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>Ruptura média</div>
      <div class="kpi-value" style="color:${rupMedia < 3 ? 'var(--green)' : rupMedia < 6 ? 'var(--amber)' : 'var(--red)'}">${fmtPct(rupMedia)}</div>
      <div class="kpi-delta neutral">do estoque</div>
    </div>
  `;
}

function renderCards(lista) {
  const grid = document.getElementById('cards-grid');
  if (!lista.length) { grid.innerHTML = ''; return; }
  grid.innerHTML = lista.map((u, i) => {
    const st = status(u);
    const pctExp = u.recebidos > 0 ? Math.round(u.expedidos / u.recebidos * 100) : 0;
    const slaBar = Math.min(u.sla_percentual || 0, 100);
    const estBar = Math.min(u.estoque_nivel || 0, 100);
    const rupBar = Math.min((u.ruptura_percentual || 0) * 10, 100);
    const alerts = [];
    if (u.sla_percentual < 88) alerts.push({ cor: 'var(--red)',   txt: `SLA crítico: ${fmtPct(u.sla_percentual)}` });
    else if (u.sla_percentual < 94) alerts.push({ cor: 'var(--amber)', txt: `SLA abaixo da meta: ${fmtPct(u.sla_percentual)}` });
    if (u.ruptura_percentual > 6) alerts.push({ cor: 'var(--red)',   txt: `Ruptura alta: ${fmtPct(u.ruptura_percentual)}` });
    else if (u.ruptura_percentual > 3) alerts.push({ cor: 'var(--amber)', txt: `Ruptura em atenção: ${fmtPct(u.ruptura_percentual)}` });
    return `
    <div class="unit-card ${st}" style="animation-delay:${i*.08}s">
      <div class="card-head">
        <div class="card-name">
          <div class="card-icon">
            <svg viewBox="0 0 24 24">${u.tipo === 'CD' ? '<rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="16 2 12 7 8 2"/>' : '<path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>'}</svg>
          </div>
          ${u.nome}
        </div>
        <span class="status-badge ${badgeClass(st)}">${badgeLabel(st)}</span>
      </div>
      <div class="card-body">
        <div class="metrics-row">
          <div class="metric">
            <div class="metric-lbl">Recebidos</div>
            <div class="metric-val">${fmt(u.recebidos)}</div>
            <div class="metric-sub">pedidos</div>
          </div>
          <div class="metric">
            <div class="metric-lbl">Expedidos</div>
            <div class="metric-val">${fmt(u.expedidos)}</div>
            <div class="metric-sub">${pctExp}% do total</div>
          </div>
          <div class="metric">
            <div class="metric-lbl">Produtiv.</div>
            <div class="metric-val">${fmt(u.pedidos_por_hora)}</div>
            <div class="metric-sub">ped./hora</div>
          </div>
        </div>
        <div class="bars">
          <div class="bar-row">
            <div class="bar-labels"><span>SLA</span><span>${fmtPct(u.sla_percentual)}</span></div>
            <div class="bar-track"><div class="bar-fill ${barColor(slaBar)}" style="width:${slaBar}%"></div></div>
          </div>
          <div class="bar-row">
            <div class="bar-labels"><span>Estoque</span><span>${fmtPct(u.estoque_nivel)}</span></div>
            <div class="bar-track"><div class="bar-fill ${barColor(estBar)}" style="width:${estBar}%"></div></div>
          </div>
          <div class="bar-row">
            <div class="bar-labels"><span>Ruptura</span><span>${fmtPct(u.ruptura_percentual)}</span></div>
            <div class="bar-track"><div class="bar-fill ${barColor(rupBar, true)}" style="width:${Math.min(rupBar,100)}%"></div></div>
          </div>
        </div>
        ${alerts.length ? `<div class="alerts-row">${alerts.map(a => `<div class="alert-item"><div class="alert-dot" style="background:${a.cor}"></div>${a.txt}</div>`).join('')}</div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function renderOcorrencias() {
  const filtradas = tabAtiva === 'all'
    ? todasOcorrencias
    : todasOcorrencias.filter(o => todosOsDados.filter(u => u.id === tabAtiva).some(u => u.codigo === o.unidade_codigo));
  const lista = document.getElementById('ocorr-list');
  if (!filtradas.length) { lista.innerHTML = ''; return; }
  const iconSvg = {
    crit: '<path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
    warn: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
    info: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
  };
  lista.innerHTML = filtradas.map((o, i) => `
    <div class="ocorr-item" style="animation-delay:${i*.05}s">
      <div class="ocorr-icon oi-${o.nivel}">
        <svg viewBox="0 0 24 24">${iconSvg[o.nivel] || iconSvg.info}</svg>
      </div>
      <div>
        <div class="ocorr-unit">${o.unidade_nome || o.unidade_codigo || ''}</div>
        <div class="ocorr-msg">${o.descricao}</div>
      </div>
      <div class="ocorr-time">${tempoRelativo(o.criado_em)}</div>
    </div>`).join('');
}

// ── INICIALIZAÇÃO ───────────────────────────────────────────
carregarDados();
intervalo = setInterval(carregarDados, 30000);
</script>
</body>
</html>
